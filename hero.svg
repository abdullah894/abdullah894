<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Abdullah Latif — web, mobile, backend and AI product developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#1B2739" stroke-width="1" opacity="0.5"/>
    </pattern>

    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080B12" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#080B12" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect width="1000" height="300" rx="16"/></clipPath>

    <style>
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .in{opacity:0;animation:in .9s ease forwards}
      .a1{animation-delay:.05s}.a2{animation-delay:.20s}.a3{animation-delay:.35s}
      .a4{animation-delay:.50s}.a5{animation-delay:.65s}.a6{animation-delay:.80s}.a7{animation-delay:.95s}
      @keyframes in{to{opacity:1}}
      .caret{animation:blink 1.15s steps(1) infinite}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .flow{stroke-dasharray:5 7;animation:dash 1.5s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .beat{animation:beat 2.8s ease-in-out infinite}
      @keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}
      .soft{animation:soft 4.5s ease-in-out infinite}
      @keyframes soft{0%,100%{opacity:.5}50%{opacity:.9}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <ellipse cx="760" cy="60" rx="330" ry="200" fill="url(#halo1)">
      <animate attributeName="cx" values="760;700;760" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;100;60" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="300" rx="300" ry="190" fill="url(#halo2)">
      <animate attributeName="cx" values="120;190;120" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <g transform="skewX(-18)">
      <rect y="-40" width="150" height="380" fill="url(#shine)">
        <animate attributeName="x" values="-260;1120" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect width="1000" height="3" fill="url(#rule)"/>
    <rect y="297" width="1000" height="3" fill="url(#rule)" opacity="0.45"/>

    <!-- ===== left column ===== -->
    <g class="in a1">
      <rect x="48" y="40" width="186" height="26" rx="13" fill="#0B1626" stroke="#1D3A5C"/>
      <circle cx="65" cy="53" r="4" fill="#34D399" class="beat"/>
      <text x="79" y="58" class="mono" font-size="11.5" fill="#7DD3FC" letter-spacing="1.5">OPEN TO BUILD WORK</text>
    </g>

    <text x="48" y="118" class="sans in a2" font-size="43" font-weight="700" fill="#F8FAFC" letter-spacing="-0.8">Abdullah Latif</text>

    <g class="in a3">
      <text x="48" y="152" class="mono" font-size="17.5">
        <tspan fill="#22D3EE">web</tspan><tspan fill="#3E4C61"> × </tspan><tspan fill="#818CF8">mobile</tspan><tspan fill="#3E4C61"> × </tspan><tspan fill="#C084FC">backend</tspan><tspan fill="#3E4C61"> × </tspan><tspan fill="#F472B6">ai</tspan>
      </text>
      <rect x="253" y="138" width="9" height="18" fill="#F472B6" class="caret"/>
    </g>

    <text x="48" y="185" class="sans in a4" font-size="13.5" fill="#7E90A8">I turn product ideas into shipped, maintained systems —</text>
    <text x="48" y="205" class="sans in a4" font-size="13.5" fill="#7E90A8">from the interface down to the database and the deploy.</text>

    <g class="in a5">
      <rect x="48" y="228" width="112" height="26" rx="6" fill="#0B1728" stroke="#1D3A5C"/>
      <text x="62" y="245" class="mono" font-size="11" fill="#7DD3FC">React Native</text>

      <rect x="168" y="228" width="76" height="26" rx="6" fill="#140F20" stroke="#372A50"/>
      <text x="182" y="245" class="mono" font-size="11" fill="#C4B5FD">NestJS</text>

      <rect x="252" y="228" width="94" height="26" rx="6" fill="#0A1A20" stroke="#1B3B44"/>
      <text x="266" y="245" class="mono" font-size="11" fill="#67E8F9">PostgreSQL</text>

      <rect x="354" y="228" width="118" height="26" rx="6" fill="#1B0F1F" stroke="#452038"/>
      <text x="368" y="245" class="mono" font-size="11" fill="#F9A8D4">LLM / Retrieval</text>
    </g>

    <!-- ===== right column : system diagram ===== -->
    <g fill="none" stroke-width="1.5">
      <path class="flow in a5" d="M700 95 H752" stroke="#22D3EE"/>
      <path class="flow in a5" d="M700 155 H752" stroke="#818CF8"/>
      <path class="flow in a6" d="M856 124 H880" stroke="#C084FC"/>
      <path class="flow in a7" d="M804 156 V214 H880" stroke="#F472B6"/>
      <path class="in a5" d="M700 95 H726 V124 H752" stroke="#1F3350"/>
      <path class="in a5" d="M700 155 H726 V124 H752" stroke="#1F3350"/>
    </g>

    <g class="in a4">
      <rect x="596" y="76" width="104" height="38" rx="9" fill="#0B1220" stroke="#1D3A5C"/>
      <text x="648" y="100" text-anchor="middle" class="mono" font-size="12" fill="#7DD3FC">Next.js</text>
    </g>
    <g class="in a5">
      <rect x="596" y="136" width="104" height="38" rx="9" fill="#0B1220" stroke="#1D3A5C"/>
      <text x="648" y="160" text-anchor="middle" class="mono" font-size="12" fill="#A5B4FC">Expo App</text>
    </g>

    <g class="in a6">
      <rect x="752" y="92" width="104" height="64" rx="10" fill="#101B2E" stroke="#31507E"/>
      <text x="804" y="117" text-anchor="middle" class="mono" font-size="12.5" fill="#E2E8F0">API</text>
      <text x="804" y="136" text-anchor="middle" class="mono" font-size="10.5" fill="#5F7391">NestJS</text>
    </g>

    <g class="in a7">
      <rect x="880" y="92" width="96" height="64" rx="10" fill="#0A1A20" stroke="#1D454F"/>
      <text x="928" y="117" text-anchor="middle" class="mono" font-size="12" fill="#67E8F9">Postgres</text>
      <text x="928" y="136" text-anchor="middle" class="mono" font-size="10" fill="#4E7481">+ pgvector</text>

      <rect x="880" y="194" width="96" height="40" rx="10" fill="#1B0F1F" stroke="#53264A"/>
      <text x="928" y="219" text-anchor="middle" class="mono" font-size="12" fill="#F9A8D4">AI Layer</text>
    </g>

    <circle cx="928" cy="168" r="2.5" fill="#334155" class="soft"/>
    <circle cx="928" cy="180" r="2.5" fill="#334155" class="soft"/>

  </g>
</svg>
