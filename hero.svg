<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Abdullah Latif — Full-stack, Mobile and AI product developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="55%" stop-color="#0D1220"/>
      <stop offset="100%" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

      .fade  { opacity: 0; animation: fadeUp .8s ease forwards; }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .25s } .d3 { animation-delay: .40s }
      .d4 { animation-delay: .55s } .d5 { animation-delay: .70s } .d6 { animation-delay: .85s }
      .d7 { animation-delay: 1.0s }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28 } }

      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }

      .drift { animation: drift 9s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translate(0,0) } to { transform: translate(-18px,10px) } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse class="drift" cx="880" cy="90" rx="360" ry="220" fill="url(#glow)"/>
    <ellipse class="drift" cx="180" cy="330" rx="320" ry="200" fill="url(#glow2)"/>

    <!-- top hairline -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.9"/>

    <!-- LEFT: identity -->
    <g class="fade d1">
      <rect x="60" y="58" width="196" height="26" rx="13" fill="#0F172A" stroke="#1E3A5F"/>
      <circle cx="78" cy="71" r="4" fill="#34D399" class="pulse"/>
      <text x="92" y="76" class="mono" font-size="12" fill="#7DD3FC" letter-spacing="1.6">OPEN TO BUILD WORK</text>
    </g>

    <text x="60" y="140" class="sans fade d2" font-size="46" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Abdullah Latif</text>

    <g class="fade d3">
      <text x="60" y="180" class="mono" font-size="19" fill="#94A3B8">
        <tspan fill="#38BDF8">web</tspan><tspan fill="#475569"> × </tspan><tspan fill="#818CF8">mobile</tspan><tspan fill="#475569"> × </tspan><tspan fill="#A78BFA">backend</tspan><tspan fill="#475569"> × </tspan><tspan fill="#F472B6">ai</tspan>
      </text>
      <rect x="316" y="164" width="10" height="20" fill="#F472B6" class="cursor"/>
    </g>

    <text x="60" y="216" class="sans fade d4" font-size="16" fill="#8FA1B8">I turn product ideas into shipped, maintained systems —</text>
    <text x="60" y="240" class="sans fade d4" font-size="16" fill="#8FA1B8">from the interface down to the database and the deploy.</text>

    <g class="fade d5" transform="translate(60,268)">
      <g>
        <rect x="0" y="0" width="118" height="28" rx="6" fill="#0F1B2E" stroke="#1E3A5F"/>
        <text x="14" y="19" class="mono" font-size="12" fill="#7DD3FC">React Native</text>
      </g>
      <g transform="translate(128,0)">
        <rect x="0" y="0" width="80" height="28" rx="6" fill="#160F1E" stroke="#3F2B4E"/>
        <text x="14" y="19" class="mono" font-size="12" fill="#C4B5FD">NestJS</text>
      </g>
      <g transform="translate(218,0)">
        <rect x="0" y="0" width="110" height="28" rx="6" fill="#0E1A22" stroke="#1F3B44"/>
        <text x="14" y="19" class="mono" font-size="12" fill="#67E8F9">PostgreSQL</text>
      </g>
      <g transform="translate(338,0)">
        <rect x="0" y="0" width="128" height="28" rx="6" fill="#1E1024" stroke="#4A2340"/>
        <text x="14" y="19" class="mono" font-size="12" fill="#F9A8D4">LLM / Retrieval</text>
      </g>
    </g>

    <!-- RIGHT: system diagram -->
    <g transform="translate(720,52)">
      <!-- connectors -->
      <g stroke="#334155" stroke-width="1.6" fill="none">
        <path class="flow" d="M120 62 H236" stroke="#38BDF8" opacity="0.85"/>
        <path class="flow" d="M120 128 H236" stroke="#818CF8" opacity="0.85"/>
        <path class="flow" d="M356 95 H420" stroke="#A78BFA" opacity="0.85"/>
        <path class="flow" d="M296 158 V206 H420" stroke="#F472B6" opacity="0.85"/>
        <path d="M236 62 H296 V95" opacity="0.5"/>
        <path d="M236 128 H296 V95" opacity="0.5"/>
      </g>

      <!-- clients -->
      <g class="fade d3">
        <rect x="0" y="40" width="120" height="44" rx="9" fill="#0F172A" stroke="#1E3A5F"/>
        <text x="60" y="67" text-anchor="middle" class="mono" font-size="13" fill="#7DD3FC">Next.js</text>
      </g>
      <g class="fade d4">
        <rect x="0" y="106" width="120" height="44" rx="9" fill="#0F172A" stroke="#1E3A5F"/>
        <text x="60" y="133" text-anchor="middle" class="mono" font-size="13" fill="#A5B4FC">Expo App</text>
      </g>

      <!-- api core -->
      <g class="fade d5">
        <rect x="236" y="62" width="120" height="66" rx="10" fill="#131C2E" stroke="#38507A"/>
        <text x="296" y="90" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">API</text>
        <text x="296" y="110" text-anchor="middle" class="mono" font-size="11" fill="#64748B">NestJS</text>
      </g>

      <!-- data + ai -->
      <g class="fade d6">
        <rect x="420" y="62" width="132" height="66" rx="10" fill="#0E1A22" stroke="#1F4A53"/>
        <text x="486" y="90" text-anchor="middle" class="mono" font-size="13" fill="#67E8F9">Postgres</text>
        <text x="486" y="110" text-anchor="middle" class="mono" font-size="11" fill="#5E7A85">+ pgvector</text>
      </g>
      <g class="fade d7">
        <rect x="420" y="182" width="132" height="48" rx="10" fill="#1E1024" stroke="#5A2A4C"/>
        <text x="486" y="212" text-anchor="middle" class="mono" font-size="13" fill="#F9A8D4">AI Layer</text>
      </g>

      <circle cx="486" cy="150" r="3" fill="#334155" class="pulse"/>
      <circle cx="486" cy="164" r="3" fill="#334155" class="pulse"/>
    </g>

    <!-- bottom hairline -->
    <rect x="0" y="337" width="1200" height="3" fill="url(#accent)" opacity="0.55"/>
  </g>
</svg>
