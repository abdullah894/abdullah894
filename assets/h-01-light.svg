<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" preserveAspectRatio="xMinYMid slice" role="img" aria-label="01 — Who I Am"><defs><linearGradient id="ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient><style> .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace} .in{opacity:0;animation:in .9s ease forwards} .a1{animation-delay:.05s}.a2{animation-delay:.2s}.a3{animation-delay:.35s}.a4{animation-delay:.5s} .a5{animation-delay:.65s}.a6{animation-delay:.8s}.a7{animation-delay:.95s} @keyframes in{to{opacity:1}} .caret{animation:blink 1.1s steps(1) infinite} @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .flow{stroke-dasharray:5 7;animation:dash 1.5s linear infinite} @keyframes dash{to{stroke-dashoffset:-24}} .beat{animation:beat 2.8s ease-in-out infinite} @keyframes beat{0%,100%{opacity:.35}50%{opacity:1}} .soft{animation:soft 4.5s ease-in-out infinite} @keyframes soft{0%,100%{opacity:.4}50%{opacity:.9}} .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) .15s forwards,in .8s ease .15s forwards;opacity:0} @keyframes rise{from{transform:translateY(8px)}to{transform:translateY(0)}} .flow2{stroke-dasharray:3 9;animation:dash 1.8s linear infinite} </style></defs><text x="2" y="38" class="mono in a1" font-size="12.5" letter-spacing="2" fill="#22D3EE">01</text><g class="rise"><text x="42" y="41" class="sans" font-weight="700" font-size="26" fill="#0F172A" letter-spacing="-0.4">Who I Am</text></g><rect x="42" y="50" height="2.5" rx="1.25" width="0" fill="url(#ul)"><animate attributeName="width" from="0" to="114" dur=".9s" begin=".55s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/></rect><text x="174" y="38" class="mono in a4" font-size="12" fill="#64748B">// about</text><g class="in a5"><circle cx="247.60000000000002" cy="32" r="2.5" fill=