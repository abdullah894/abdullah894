<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Abdullah Latif — web, mobile, backend and AI product developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="halo1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#1B2739" stroke-width="1" opacity="0.5"/>
    </pattern>
    <clipPath id="card"><rect width="640" height="400" rx="16"/></clipPath>
    <style>
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .in{opacity:0;animation:in .9s ease forwards}
      .a1{animation-delay:.05s}.a2{animation-delay:.2s}.a3{animation-delay:.35s}
      .a4{animation-delay:.5s}.a5{animation-delay:.65s}.a6{animation-delay:.8s}
      @keyframes in{to{opacity:1}}
      .caret{animation:blink 1.15s steps(1) infinite}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .flow{stroke-dasharray:5 7;animation:dash 1.5s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .beat{animation:beat 2.8s ease-in-out infinite}
      @keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="640" height="400" fill="url(#bg)"/>
    <rect width="640" height="400" fill="url(#grid)"/>
    <ellipse cx="520" cy="40" rx="280" ry="180" fill="url(#halo1)">
      <animate attributeName="cy" values="40;90;40" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="80" cy="400" rx="260" ry="170" fill="url(#halo2)"/>

    <rect width="640" height="4" fill="url(#rule)"/>
    <rect y="396" width="640" height="4" fill="url(#rule)" opacity="0.45"/>

    <g class="in a1">
      <rect x="40" y="44" width="228" height="32" rx="16" fill="#0B1626" stroke="#1D3A5C"/>
      <circle cx="61" cy="60" r="5" fill="#34D399" class="beat"/>
      <text x="78" y="65" class="mono" font-size="14" fill="#7DD3FC" letter-spacing="1.6">OPEN TO BUILD WORK</text>
    </g>

    <text x="40" y="140" class="sans in a2" font-size="50" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Abdullah Latif</text>

    <g class="in a3">
      <text x="40" y="182" class="mono" font-size="22">
        <tspan fill="#22D3EE">web</tspan><tspan fill="#3E4C61"> × </tspan><tspan fill="#818CF8">mobile</tspan><tspan fill="#3E4C61"> × </tspan><tspan fill="#C084FC">backend</tspan><tspan fill="#3E4C61"> × </tspan><tspan fill="#F472B6">ai</tspan>
      </text>
      <rect x="316" y="164" width="11" height="23" fill="#F472B6" class="caret"/>
    </g>

    <text x="40" y="222" class="sans in a4" font-size="17" fill="#7E90A8">Product ideas → shipped, maintained systems.</text>
    <text x="40" y="248" class="sans in a4" font-size="17" fill="#7E90A8">Interface down to database and deploy.</text>

    <g class="in a5">
      <rect x="40" y="278" width="144" height="34" rx="8" fill="#0B1728" stroke="#1D3A5C"/>
      <text x="58" y="300" class="mono" font-size="14" fill="#7DD3FC">React Native</text>
      <rect x="194" y="278" width="98" height="34" rx="8" fill="#140F20" stroke="#372A50"/>
      <text x="212" y="300" class="mono" font-size="14" fill="#C4B5FD">NestJS</text>
      <rect x="302" y="278" width="122" height="34" rx="8" fill="#0A1A20" stroke="#1B3B44"/>
      <text x="320" y="300" class="mono" font-size="14" fill="#67E8F9">PostgreSQL</text>
    </g>

    <g class="in a6">
      <rect x="40" y="322" width="152" height="34" rx="8" fill="#1B0F1F" stroke="#452038"/>
      <text x="58" y="344" class="mono" font-size="14" fill="#F9A8D4">LLM / Retrieval</text>
      <g fill="none" stroke-width="2">
        <path class="flow" d="M212 339 H392" stroke="#818CF8" opacity="0.7"/>
      </g>
      <circle cx="404" cy="339" r="5" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.7"/>
      <circle cx="404" cy="339" r="2" fill="#F472B6" class="beat"/>
    </g>
  </g>
</svg>
